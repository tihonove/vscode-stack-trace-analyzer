name: Bump Version

on:
    workflow_dispatch:
        inputs:
            bump_type:
                description: "Version bump type"
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major
            channel:
                description: "Release channel"
                required: true
                default: stable
                type: choice
                options:
                    - stable
                    - pre-release

permissions:
    contents: write

jobs:
    bump-version:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2
              with:
                  token: ${{ secrets.PAT }}

            - name: Use Node.js 20.x
              uses: actions/setup-node@v2
              with:
                  node-version: 20.x

            - name: Configure Git user
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Bump version
              run: |
                  # The marketplace rejects semver prerelease versions, so the version
                  # itself stays plain x.y.z and the channel is encoded in the tag:
                  # v1.16.0 — stable, v1.16.0-pre — pre-release.
                  VERSION="$(npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version)"
                  VERSION="${VERSION#v}"
                  TAG="v$VERSION"
                  if [ "${{ github.event.inputs.channel }}" = "pre-release" ]; then
                      TAG="$TAG-pre"
                  fi
                  git commit -a -m "chore(release): $VERSION"
                  git tag -a "$TAG" -m "chore(release): $VERSION"

            - name: Push commit and tag
              run: git push origin HEAD --follow-tags
