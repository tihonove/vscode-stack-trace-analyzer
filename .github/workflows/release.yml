name: Publish Extension

on:
    push:
        tags:
            - "v*.*.*"
            - "v*.*.*-pre"

permissions:
    contents: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2
              with:
                  fetch-depth: 0

            - name: Use Node.js 20.x
              uses: actions/setup-node@v2
              with:
                  node-version: 20.x

            - run: npm install

            - name: Generate Changelog
              id: cliff
              uses: orhun/git-cliff-action@v4
              with:
                  args: --latest --strip all

            - name: Get version and channel
              id: meta
              run: |
                  # v1.16.0 — stable, v1.16.0-pre — pre-release channel.
                  TAG="${GITHUB_REF_NAME}"
                  VERSION="${TAG#v}"
                  VERSION="${VERSION%-pre}"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  if [ "$TAG" != "v$VERSION" ]; then
                      echo "pre_release=true" >> $GITHUB_OUTPUT
                      echo "pre_release_flag=--pre-release" >> $GITHUB_OUTPUT
                      echo "title_suffix= (pre-release)" >> $GITHUB_OUTPUT
                  else
                      echo "pre_release=false" >> $GITHUB_OUTPUT
                      echo "pre_release_flag=" >> $GITHUB_OUTPUT
                      echo "title_suffix=" >> $GITHUB_OUTPUT
                  fi
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
                      echo "Tag $TAG does not match package.json version $PACKAGE_VERSION" >&2
                      exit 1
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: Stack trace analyzer ${{ github.ref_name }}${{ steps.meta.outputs.title_suffix }}
                  prerelease: ${{ steps.meta.outputs.pre_release }}
                  body: |
                      ${{ steps.cliff.outputs.content }}

                      [VSCode Marketplace](https://marketplace.visualstudio.com/items?itemName=tihonove.stack-trace-analyzer) | [Open VSX Registry](https://open-vsx.org/extension/tihonove/stack-trace-analyzer) | [Direct download](https://marketplace.visualstudio.com/_apis/public/gallery/publishers/tihonove/vsextensions/stack-trace-analyzer/${{ steps.meta.outputs.version }}/vspackage)

            - name: Install vsce
              run: npm install -g @vscode/vsce

            - name: Install ovsx
              run: npm install -g ovsx

            # --allow-unused-files-pattern: CHANGELOG.md must be listed in the "files"
            # property to be packaged at all, but vsce turns it into an in-memory
            # asset before running its unused-pattern check, so the check reports it
            # as unmatched and exits non-zero.
            - name: Package Extension
              run: vsce package --no-git-tag-version --allow-unused-files-pattern ${{ steps.meta.outputs.pre_release_flag }}

            - name: Publish to VS Marketplace
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: vsce publish --no-git-tag-version ${{ steps.meta.outputs.pre_release_flag }} --packagePath *.vsix

            # ovsx ignores --pre-release for a prepackaged vsix and reads the flag
            # from the manifest written by `vsce package --pre-release`.
            - name: Publish to Open VSX Registry
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
              run: ovsx publish *.vsix
